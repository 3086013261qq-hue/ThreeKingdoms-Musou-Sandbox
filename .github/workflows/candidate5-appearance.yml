name: Candidate5 appearance publisher

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    if: github.event.head_commit.message == 'Prepare Candidate5 appearance publish'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build appearance authority index and Candidate5
        shell: bash
        run: |
          python - <<'PY'
          import json, base64, hashlib, zlib
          from pathlib import Path

          src_json = Path('build/三国无双姬_v1.0.0-candidate4.json')
          src_png  = Path('build/三国无双姬_v1.0.0-candidate4.png')
          out_json = Path('build/三国无双姬_v1.0.0-candidate5.json')
          out_png  = Path('build/三国无双姬_v1.0.0-candidate5.png')
          index_txt = Path('mvu/prompts/appearance-index.v1.txt')
          qa_txt   = Path('qa/Candidate5_QA.txt')

          card = json.loads(src_json.read_text(encoding='utf-8'))
          entries = card['data']['character_book']['entries']
          chars = [e for e in entries if str(e.get('comment','')).startswith('角色:')]
          assert len(chars) == 91, len(chars)

          def parse_fields(content):
              out = {}
              for raw in content.splitlines():
                  line = raw.strip()
                  for key in ('名字','发色','发型','瞳色','身材','胸部','上衣','下装','配饰','鞋子'):
                      p = key + ':'
                      if line.startswith(p):
                          out[key] = line[len(p):].strip()
              return out

          rows = []
          missing = []
          for e in chars:
              f = parse_fields(e.get('content',''))
              name = f.get('名字') or e['comment'].split(':',1)[1]
              required = ('发色','发型','瞳色','身材','胸部')
              if any(not f.get(k) for k in required):
                  missing.append((name,[k for k in required if not f.get(k)]))
                  continue
              outfit = '；'.join(x for x in [f.get('上衣',''),f.get('下装','')] if x)
              accessories = f.get('配饰','')
              shoes = f.get('鞋子','')
              rows.append(
                  f"- {name}｜{f['身材']}｜发色:{f['发色']}｜发型:{f['发型']}｜瞳色:{f['瞳色']}｜胸部:{f['胸部']}"
                  + (f"｜服装:{outfit}" if outfit else '')
                  + (f"｜配饰:{accessories}" if accessories else '')
                  + (f"｜鞋:{shoes}" if shoes else '')
              )
          assert not missing, missing
          assert len(rows) == 91

          header = '''<appearance_authority_contract>
【人物外貌最高优先级】
本卡的角色人物条目与下方“角色外貌总索引”是世界内真实外貌的唯一权威。三国演义、史料、游戏原型、模型先验记忆只可提供剧情/身份/事件骨架，不得用原作经典相貌描写覆盖本卡设定。

硬规则：
1. 任何已列入索引的角色一旦进入正文、平行线、回忆、状态栏或幕后推演，必须以索引/角色条目的发色、发型、瞳色、身高体型、胸部与标志性配饰为准；若完整角色条目已触发，以完整角色条目补充细节，但不得与索引冲突。
2. 禁止从原作套回经典男性化或原版相貌模板。尤其禁止把刘备写成“双耳垂肩/双手过膝”，把张飞写成“豹头环眼/燕颔虎须/黑脸虬髯”，把关羽写成“面如重枣/长髯/美髯公”等，除非这些特征本身明确存在于本卡角色条目。
3. 不得自行编造角色条目没有提供的身高、体重、三围、胸围数值、发色、发型或眼色。状态栏若无数值，只写本卡已有的定性字段，例如“151cm、娇小结实、胸部偏小”，禁止补成虚构的56kg或86/62/90。
4. 场景服装允许因时代阶段、天气、贫富、军旅状态而作合理换装，但人物不可变的视觉锚点（身高体型、发色发型、瞳色、胸部层级、核心轮廓与标志配饰）必须保持；换装也不得退回原作默认造型。
5. 原著原文若被明确引用，可在“引用文本”中保留原句；世界内实际人物的外貌描写仍必须按本卡设定重写。
6. 同一角色在<story_scene>、<parallel_line>与<special_status>之间必须外貌一致，禁止正文一套、状态栏另一套。

【角色外貌总索引】
'''
          contract = header + '\n'.join(rows) + '\n</appearance_authority_contract>\n'
          index_txt.parent.mkdir(parents=True, exist_ok=True)
          index_txt.write_text(contract, encoding='utf-8')

          phi = card['data'].get('post_history_instructions','')
          assert '<appearance_authority_contract>' not in phi
          card['data']['post_history_instructions'] = phi.rstrip() + '\n\n' + contract
          card['data']['character_version'] = '1.0.0-candidate5'
          card['data']['creator_notes'] = (
              'Candidate5：仅修人物外貌权威与首楼召回。继承Candidate4全部修复；'
              '新增91人压缩外貌总索引，禁止原作经典相貌覆盖本卡锚点，'
              '并禁止状态栏虚构未设定的体重/三围。待真实 Android / SillyTavern 实机验收。'
          )
          out_json.write_text(json.dumps(card, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # Persist the same authority layer into the normal source assembler for future rebuilds.
          build = Path('tools/build_candidate.py')
          text = build.read_text(encoding='utf-8')
          old = "post_history_instructions=read('mvu/prompts/faction-output.txt'),creator='多娜'"
          new = "post_history_instructions=read('mvu/prompts/faction-output.txt')+'\\n'+read('mvu/prompts/appearance-index.v1.txt'),creator='多娜'"
          assert old in text, 'build_candidate.py patch anchor missing'
          build.write_text(text.replace(old,new,1), encoding='utf-8')

          # Re-embed Candidate5 card JSON into the existing Candidate4 PNG without touching image IDAT.
          compact = json.dumps(card, ensure_ascii=False).encode('utf-8')
          payload = base64.b64encode(compact)
          png = src_png.read_bytes()
          assert png[:8] == b'\x89PNG\r\n\x1a\n'

          def mk_chunk(t,d):
              body = t+d
              return len(d).to_bytes(4,'big') + body + (zlib.crc32(body)&0xffffffff).to_bytes(4,'big')

          out = bytearray(png[:8]); pos=8
          idat_before = hashlib.sha256(); idat_after = hashlib.sha256()
          seen = set()
          while pos < len(png):
              ln = int.from_bytes(png[pos:pos+4],'big')
              typ = png[pos+4:pos+8]
              dat = png[pos+8:pos+8+ln]
              whole = png[pos:pos+12+ln]
              if typ == b'tEXt':
                  key,_,val = dat.partition(b'\x00')
                  if key in (b'chara',b'ccv3'):
                      whole = mk_chunk(b'tEXt', key+b'\x00'+payload)
                      seen.add(key)
              if typ == b'IDAT': idat_before.update(dat)
              out.extend(whole)
              if typ == b'IDAT': idat_after.update(dat)
              pos += 12 + ln
          assert seen == {b'chara',b'ccv3'}, seen
          out_png.write_bytes(out)
          assert idat_before.hexdigest() == idat_after.hexdigest()

          # Decode both embedded payloads and prove they equal the Candidate5 JSON object.
          def embedded(path):
              b = Path(path).read_bytes(); pos=8; got={}
              while pos < len(b):
                  ln=int.from_bytes(b[pos:pos+4],'big'); typ=b[pos+4:pos+8]; dat=b[pos+8:pos+8+ln]
                  if typ == b'tEXt':
                      key,_,val = dat.partition(b'\x00')
                      if key in (b'chara',b'ccv3'):
                          got[key.decode()] = json.loads(base64.b64decode(val).decode('utf-8'))
                  pos += 12+ln
              return got
          emb = embedded(out_png)
          assert emb['chara'] == card and emb['ccv3'] == card

          def sha256(p): return hashlib.sha256(Path(p).read_bytes()).hexdigest()
          qa = [
              'Candidate5 QA PASS','',
              f'Candidate4 JSON SHA256: {sha256(src_json)}',
              f'Candidate4 PNG  SHA256: {sha256(src_png)}',
              f'Candidate5 JSON SHA256: {sha256(out_json)}',
              f'Candidate5 PNG  SHA256: {sha256(out_png)}',
              f'Appearance index SHA256: {sha256(index_txt)}','',
              f'Candidate5 JSON size: {out_json.stat().st_size} bytes',
              f'Candidate5 PNG  size: {out_png.stat().st_size} bytes',
              f'Appearance index rows: {len(rows)}','',
              'PNG image layer (all IDAT chunks): UNCHANGED',
              f'IDAT SHA256: {idat_before.hexdigest()}',
              'Embedded chara == Candidate5 JSON object: PASS',
              'Embedded ccv3 == Candidate5 JSON object: PASS','',
              'Appearance authority checks:',
              '- 91/91 character entries parsed into compact authority index: PASS',
              '- 刘备 anchor must remain 151cm / 粉红 / 双马尾 / 翠绿: PASS',
              '- 张飞 anchor must remain 175cm / 黑褐 / 双丸子 / 琥珀黑: PASS',
              '- 关羽 anchor must remain 183cm / 深青 / 超长高马尾 / 墨绿: PASS',
              '- Original-stock appearance override is explicitly forbidden: PASS',
              '- Invented weight/BWH values are explicitly forbidden: PASS',
              '- Scene clothing may adapt, immutable visual anchors may not: PASS',
              '- Candidate4 female-world and faction-affinity fixes are inherited unchanged: PASS'
          ]
          # Verify the three user-reported anchors from the actual generated contract.
          joined='\n'.join(rows)
          assert '刘备｜151cm' in joined and '发色:粉红' in joined and '发型:双马尾' in joined and '瞳色:翠绿' in joined
          assert '张飞｜175cm' in joined and '发色:黑褐' in joined and '发型:双丸子' in joined and '瞳色:琥珀黑' in joined
          assert '关羽｜183cm' in joined and '发色:深青' in joined and '发型:超长高马尾' in joined and '瞳色:墨绿' in joined
          qa_txt.write_text('\n'.join(qa)+'\n',encoding='utf-8')
          PY
      - name: Commit Candidate5 and clean one-shot files
        shell: bash
        run: |
          rm -f .candidate5-trigger .github/workflows/candidate5-appearance.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix character appearance authority and publish Candidate5'
          git push origin HEAD:main
