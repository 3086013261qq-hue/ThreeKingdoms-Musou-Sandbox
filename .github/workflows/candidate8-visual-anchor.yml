name: Candidate8 compact visual anchor publisher

on:
  push:
    paths:
      - '.candidate8-trigger'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build Candidate8 from Candidate7
        run: python tools/candidate8_hotfix.py
      - name: Commit Candidate8 and clean one-shot files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "build/三国无双姬_v1.0.0-candidate8.json" "build/三国无双姬_v1.0.0-candidate8.png" "qa/Candidate8_QA.txt"
          git rm tools/candidate8_hotfix.py .github/workflows/candidate8-visual-anchor.yml .candidate8-trigger
          git commit -m "Optimize visual anchors and publish Candidate8"
          git push origin HEAD:main
