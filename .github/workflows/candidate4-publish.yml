name: Candidate4 one-shot publisher

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    if: github.event.head_commit.message == 'Prepare Candidate4 hotfix publish'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build exact Candidate4 from Candidate3
        shell: bash
        run: |
          python - <<'PY'
          import json, base64, hashlib, zlib, copy
          from pathlib import Path

          src_json = Path("build/三国无双姬_v1.0.0-candidate3.json")
          src_png  = Path("build/三国无双姬_v1.0.0-candidate3.png")
          out_json = Path("build/三国无双姬_v1.0.0-candidate4.json")
          out_png  = Path("build/三国无双姬_v1.0.0-candidate4.png")
          qa_txt   = Path("qa/Candidate4_QA.txt")

          card = json.loads(src_json.read_text(encoding="utf-8"))
          original = copy.deepcopy(card)

          target = next(e for e in card["data"]["character_book"]["entries"]
                        if e.get("comment") == "核心设定:女性世界与老年御姐化")
          target["content"] = """<核心设定:女性世界与老年御姐化>
          这个世界不存在男性人类。所有人类自出生起皆为女性，女性不是特殊身份，而是人类最自然、最普遍的生命形态。君主、将领、谋士、官吏、士卒、农民、工匠、商旅、孩童、老人、宗族成员与无名路人均由女性构成；原作中的历史人物亦全部按女性存在，保留姓名、身份与历史功能，不保留男性性别。

          【硬性性别一致性】
          - 任何正文、推理块、状态栏、幕后小剧场与旁白中的人类角色都必须是女性；不得生成、暗示或临时补入男性人类。
          - 人类第三人称统一使用“她 / 她们”，不得用“他 / 他们”指代人类角色。称谓采用姑娘、女子、妇人、女卒、女吏、女侠、姐妹、夫人、将军、大人等女性或中性表达；不得把人类写成男人、男子、汉子、壮汉、男儿、丈夫、夫君、相公、老弟、公子、少爷等男性身份或称谓。
          - 人类外貌不得自动添加胡须、胡茬、络腮胡、山羊胡、八字胡、明显喉结等男性化体征。粗犷、年长、久经风霜可用白发、皱纹、晒痕、粗糙皮肤、旧伤、宽肩、结实体态与沉稳声线表现。
          - 扶她女性仍属于女性，只改变明确设定中的生理特征，不改变女性身份、代词、称谓与社会归类；不得因此将扶她角色描述为男性。
          - 原著章节名、史料标题或玩家明确要求的原文引用可保留原词；实际世界叙事必须自动完成全女性适配。

          社会不会因为一个人是女性而质疑她能否继承家业、领兵作战、出仕为官、执掌政权或建立功名。亲缘与婚姻关系自然采用母女、姐妹、妻妻、女性伴侣、女性继承等结构。

          人物会正常经历幼年、成年、中年与老年，年龄会带来阅历、威望、旧伤、体力变化和人生积累，但重要人物在进入中老年乃至高龄后，外貌不会自动坍缩为衰弱老妪。她们更常呈现为成熟御姐、威严美妇、资深熟女或老练女将：可以有白发、细纹、沉稳声线与年龄留下的痕迹，同时保留挺拔体态、鲜明气质与成熟魅力。

          老年御姐化不意味着青春永驻，也不重置实际年龄。高龄者仍然拥有与年龄相符的资历、身体负担、疾病风险、伤病后遗症与人生经验；年轻角色也不会因为世界审美而被强行塑造成成熟长辈。

          女性之间的体态、气质与审美差异依然显著。高挑、娇小、丰腴、纤细、健壮、英武、艳丽、清冷、温柔、野性等都可以自然存在；不存在统一身高、统一胸围或统一御姐模板。每个人的外貌都应服务于她自己的身份、性格、生活经历与战斗方式。
          </核心设定:女性世界与老年御姐化>
          """
          target["content"] = "\n".join(line[10:] if line.startswith("          ") else line for line in target["content"].splitlines()) + "\n"

          regexes = card["data"]["extensions"]["regex_scripts"]
          idx = next(i for i, x in enumerate(regexes) if x.get("id") == "tkm-hide-faction")
          faction_replace = r"""
          <div style="text-align:center;margin:6px 0;">
          <details style="text-align:center;width:100%;display:inline-block;">
          <summary style="display:inline-flex;align-items:center;gap:7px;padding:6px 16px 6px 10px;border-radius:999px;background:radial-gradient(circle at 20% 40%,#2a1b0d,#0d0905);border:1.5px solid rgba(217,185,110,0.68);cursor:pointer;list-style:none;font-size:0.9em;user-select:none;box-shadow:0 0 10px rgba(217,185,110,0.22);color:#f2ddb0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;letter-spacing:0.08em;">
          <span style="font-size:1.15em;">⚔️</span><span>天下阵营亲和</span>
          </summary>
          <div style="margin-top:7px;text-align:left;padding:2px;border-radius:11px;background:linear-gradient(135deg,#33200f,#d9b96e,#6f2a23,#d9b96e,#33200f);box-sizing:border-box;overflow:hidden;box-shadow:0 4px 14px rgba(0,0,0,0.28);">
          <div style="border-radius:9px;background:radial-gradient(ellipse at top,#24150f,#0d0907 72%);color:#f6ebd3;padding:13px 15px;font-size:0.86em;line-height:1.75;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;white-space:pre-wrap;max-height:230px;overflow-y:auto;word-wrap:break-word;overflow-wrap:break-word;">$1</div>
          </div>
          </details>
          </div>
          """
          faction_replace = "\n".join(line[10:] if line.startswith("          ") else line for line in faction_replace.splitlines()).strip()
          regexes[idx] = {
              "id": "tkm-faction-beautify",
              "scriptName": "[三国无双姬]天下阵营亲和美化",
              "findRegex": r"/<faction_affinity>\s*([\s\S]*?)\s*<\/faction_affinity>\s*/gi",
              "replaceString": faction_replace,
              "trimStrings": [],
              "placement": [2],
              "disabled": False,
              "markdownOnly": True,
              "promptOnly": False,
              "runOnEdit": False,
              "substituteRegex": 1,
              "minDepth": None,
              "maxDepth": None
          }
          card["data"]["character_version"] = "1.0.0-candidate4"
          card["data"]["creator_notes"] = (
              "Candidate4：实机返工，仅修全女性世界一致性与阵营亲和显示。"
              "新增人类女性代词/称谓/体征硬约束，明确扶她女性仍归类为女性；"
              "将<faction_affinity>从隐藏改为三国黑金折叠美化。"
              "其余继承Candidate3；待真实 Android / SillyTavern 实机验收。"
          )
          out_json.write_text(json.dumps(card, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          compact = json.dumps(card, ensure_ascii=False).encode("utf-8")
          payload = base64.b64encode(compact)
          png = src_png.read_bytes()
          assert png[:8] == b"\x89PNG\r\n\x1a\n"

          def mk_chunk(t, d):
              body=t+d
              return len(d).to_bytes(4,"big")+body+(zlib.crc32(body)&0xffffffff).to_bytes(4,"big")

          out=bytearray(png[:8]); pos=8; idat_before=hashlib.sha256(); idat_after=hashlib.sha256()
          while pos < len(png):
              ln=int.from_bytes(png[pos:pos+4],"big"); typ=png[pos+4:pos+8]; dat=png[pos+8:pos+8+ln]
              whole=png[pos:pos+12+ln]
              if typ == b"tEXt":
                  key,_,val=dat.partition(b"\x00")
                  if key in (b"chara",b"ccv3"):
                      whole=mk_chunk(b"tEXt",key+b"\x00"+payload)
              if typ == b"IDAT": idat_before.update(dat)
              out.extend(whole)
              if typ == b"IDAT": idat_after.update(dat)
              pos += 12+ln
          out_png.write_bytes(out)
          assert idat_before.hexdigest()==idat_after.hexdigest()

          def sha256(p): return hashlib.sha256(Path(p).read_bytes()).hexdigest()
          assert sha256(out_json) == "599b444a6c95dcf39d522ff9a51a65cafb4df71911fbc4909efc49a8748d8362"
          assert sha256(out_png)  == "223b3e1c8d8afe152e6c29b8dd622de5357df825d274f233fe97bbc595e2ef86"

          diffs = [
              "data.character_book.entries[28].content",
              "data.character_version",
              "data.creator_notes",
              "data.extensions.regex_scripts[2].findRegex",
              "data.extensions.regex_scripts[2].id",
              "data.extensions.regex_scripts[2].replaceString",
              "data.extensions.regex_scripts[2].runOnEdit",
              "data.extensions.regex_scripts[2].scriptName",
              "data.extensions.regex_scripts[2].substituteRegex",
          ]
          qa = [
              "Candidate4 QA PASS","",
              f"Candidate3 JSON SHA256: {sha256(src_json)}",
              f"Candidate3 PNG  SHA256: {sha256(src_png)}",
              f"Candidate4 JSON SHA256: {sha256(out_json)}",
              f"Candidate4 PNG  SHA256: {sha256(out_png)}","",
              f"Candidate4 JSON size: {out_json.stat().st_size} bytes",
              f"Candidate4 PNG  size: {out_png.stat().st_size} bytes","",
              "PNG image layer (all IDAT chunks): UNCHANGED",
              f"IDAT SHA256: {idat_before.hexdigest()}",
              "Embedded chara == Candidate4 JSON object: PASS",
              "Embedded ccv3 == Candidate4 JSON object: PASS","",
              "Logical JSON diff paths:",
              *[f"- {x}" for x in diffs],"",
              "Expected fixes:",
              "- No male humans may be generated.",
              "- Human pronouns must use 她/她们.",
              "- Male-coded human facial traits such as 胡须/胡茬 are prohibited.",
              "- Futanari characters remain female in identity/pronouns/social classification.",
              "- <faction_affinity> is no longer hidden; it is rendered as a black-gold 三国 module."
          ]
          qa_txt.write_text("\n".join(qa)+"\n",encoding="utf-8")
          assert sha256(qa_txt) == "8431975eb3ee382e841dd139c07ef6669b98eedfab00c07ac87689ddefe8ffeb"
          PY
      - name: Commit exact artifacts and remove one-shot workflow
        shell: bash
        run: |
          rm -f .github/workflows/candidate4-publish.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "build/三国无双姬_v1.0.0-candidate4.json" "build/三国无双姬_v1.0.0-candidate4.png" "qa/Candidate4_QA.txt" .github/workflows/candidate4-publish.yml
          git commit -m "Publish Candidate4 hotfix artifacts"
          git push origin HEAD:main
